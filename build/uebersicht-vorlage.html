<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulationen und Lektionen &middot; t-bk.de</title>
<meta name="description" content="Simulationen zum Ausprobieren und Lektionen zum Durcharbeiten – direkt im Browser, ohne Anmeldung.">
<style>
  :root{
    --bg:#f7f7f5; --fg:#1a1a1a; --muted:#5f5f5a;
    --card:#fff; --border:#e3e3df; --accent:#2b6cb0; --accent-fg:#fff;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  }
  /* Dunkel gilt, wenn das System dunkel steht - es sei denn, es wurde
     ausdruecklich hell gewaehlt (tools/assets/thema.js). */
  @media (prefers-color-scheme:dark){
    :root:not([data-thema="hell"]){
      --bg:#151517; --fg:#ececec; --muted:#a0a0a0;
      --card:#1e1e21; --border:#2c2c30; --accent:#5b9bd5; --accent-fg:#0b0b0c;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  /* Ausdruecklich dunkel gewaehlt - auch auf einem hellen System. */
  :root[data-thema="dunkel"]{
    --bg:#151517; --fg:#ececec; --muted:#a0a0a0;
    --card:#1e1e21; --border:#2c2c30; --accent:#5b9bd5; --accent-fg:#0b0b0c;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{width:100%; max-width:1000px; margin:0 auto; padding:0 20px}
  a{color:var(--accent)}
  header{padding:48px 0 8px}
  .back{display:inline-block; margin-bottom:18px; font-size:14px; text-decoration:none}
  .back:hover{text-decoration:underline}
  h1{font-size:clamp(26px,4vw,34px); letter-spacing:-.5px; margin:0 0 10px}
  .lead{color:var(--muted); font-size:17px; margin:0}

  /* Die beiden Haupt-Tabs. Sie unterscheiden, was einen erwartet:
     etwas ausprobieren oder etwas durcharbeiten. */
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:26px 0 0}
  .tabs button{
    font:600 15px/1 inherit; cursor:pointer; padding:11px 18px;
    border-radius:999px; border:1px solid var(--border);
    background:var(--card); color:var(--fg);
  }
  .tabs button[aria-selected="true"]{
    background:var(--accent); color:var(--accent-fg); border-color:var(--accent);
  }
  .tabs .anzahl{opacity:.65; font-weight:400; margin-left:6px}
  .was{color:var(--muted); font-size:14.5px; margin:14px 0 0}

  .bg-zeile{
    margin:16px 0 0; padding:12px 14px; border-radius:10px;
    background:var(--card); border:1px solid var(--border);
  }
  .bg-zeile:empty{display:none}
  .suche{
    width:100%; margin:16px 0 0; padding:11px 14px; font:inherit; font-size:15px;
    color:var(--fg); background:var(--card);
    border:1px solid var(--border); border-radius:10px;
  }
  .suche:focus{outline:2px solid var(--accent); outline-offset:1px}

  .bereich{
    font-size:21px; font-weight:700; letter-spacing:-.3px; margin:42px 0 0;
    padding-top:26px; border-top:1px solid var(--border);
  }
  .bereich:first-of-type{border-top:0; padding-top:6px; margin-top:18px}
  .cat{
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin:26px 0 0;
  }
  .grid{
    display:grid; gap:14px; padding:14px 0 8px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  a.card{
    display:flex; flex-direction:column; gap:5px; justify-content:center;
    min-height:70px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:15px 18px; text-decoration:none; color:inherit;
    box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s ease;
    font-weight:600; font-size:15px;
  }
  a.card:hover{transform:translateY(-3px); border-color:var(--accent)}
  a.card .sub{font-weight:400; font-size:13px; color:var(--muted); line-height:1.45}
  .leer{color:var(--muted); font-size:15px; padding:24px 0}
  footer{
    text-align:center; color:var(--muted); font-size:13px;
    padding:40px 0 32px; border-top:1px solid var(--border); margin-top:48px;
  }
  footer a{color:var(--muted)}
  @media (prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
<script src="tools/assets/thema.js"></script>
<script src="tools/assets/bildungsgang.js"></script>
</head>
<body>
  <header class="wrap">
    <a class="back" href="/">&larr; Startseite</a>
    <h1>Simulationen und Lektionen</h1>
    <p class="lead">Zum Ausprobieren und zum Durcharbeiten &ndash; direkt im
      Browser, ohne Anmeldung.</p>
  </header>

  <main class="wrap">
    <div class="tabs" role="tablist">
      <button role="tab" data-art="simulation" aria-selected="true">Simulationen<span class="anzahl">{{ANZAHL_SIMULATION}}</span></button>
      <button role="tab" data-art="lektion" aria-selected="false">Lektionen<span class="anzahl">{{ANZAHL_LEKTION}}</span></button>
    </div>
    <p class="was" id="was"></p>

    <div class="bg-zeile" id="bg-zeile"></div>
    <input class="suche" id="suche" type="search" placeholder="Suchen …" aria-label="Suchen">

    <section id="p-simulation">
{{SIMULATIONEN}}
    </section>
    <section id="p-lektion" hidden>
{{LEKTIONEN}}
    </section>
    <p class="leer" id="leer" hidden>Nichts gefunden.</p>
  </main>

  <footer class="wrap">
    &copy; 2026 t-bk.de &middot; <a href="/impressum.html">Impressum</a> &middot;
    <a href="/datenschutz.html">Datenschutz</a>
  </footer>

<script>
"use strict";
/* Zwei Haupt-Tabs und eine Suche. Mehr braucht die Übersicht nicht - und ohne
   Abhängigkeiten funktioniert sie auch lokal per Doppelklick. */

var WAS = {
  simulation: "Etwas einstellen, ablesen, ausprobieren. Jede Simulation " +
    "rechnet und zeichnet mit, während man die Werte ändert.",
  lektion: "Ein Thema von vorn bis hinten, in Kapiteln. Zum Lesen, Vorführen " +
    "und Nachschlagen - mit Simulationen darin, wo sie helfen."
};

function el(id){ return document.getElementById(id); }

var aktuell = "simulation";

function reiterSetzen(art){
  aktuell = art;
  var knoepfe = document.querySelectorAll(".tabs button");
  for(var i = 0; i < knoepfe.length; i++){
    knoepfe[i].setAttribute("aria-selected",
      knoepfe[i].getAttribute("data-art") === art ? "true" : "false");
  }
  el("p-simulation").hidden = art !== "simulation";
  el("p-lektion").hidden = art !== "lektion";
  el("was").textContent = WAS[art];
  suchen();
}

/* Gesucht wird nur im gerade offenen Reiter - sonst sucht man in etwas,
   das man nicht sieht. */
function suchen(){
  var q = el("suche").value.trim().toLowerCase();
  var bereich = el("p-" + aktuell);
  var B = window.tbkBildungsgang;
  var bg = B ? B.lesen() : "";
  var karten = bereich.querySelectorAll("a.card");
  var treffer = 0;
  for(var i = 0; i < karten.length; i++){
    /* Was der Bildungsplan nicht hergibt, steht hier gar nicht erst. */
    var passt = (!B || B.gilt(karten[i], bg))
      && (!q || karten[i].textContent.toLowerCase().indexOf(q) !== -1);
    karten[i].hidden = !passt;
    if(passt) treffer++;
  }
  /* Überschriften ohne sichtbare Karten verschwinden mit. */
  var bloecke = bereich.querySelectorAll(".grid");
  for(var j = 0; j < bloecke.length; j++){
    var sichtbar = bloecke[j].querySelectorAll("a.card:not([hidden])").length;
    bloecke[j].hidden = !sichtbar;
    var kopf = bloecke[j].previousElementSibling;
    if(kopf && (kopf.classList.contains("cat") || kopf.classList.contains("bereich"))){
      kopf.hidden = !sichtbar;
    }
  }
  /* Ein Bereich ist leer, wenn darunter nichts mehr steht. */
  var bereiche = bereich.querySelectorAll(".bereich");
  for(var k = 0; k < bereiche.length; k++){
    var n = bereiche[k], hatEtwas = false;
    while((n = n.nextElementSibling) && !n.classList.contains("bereich")){
      if(!n.hidden && n.classList.contains("grid")) hatEtwas = true;
    }
    bereiche[k].hidden = !hatEtwas;
  }
  el("leer").hidden = treffer > 0;
}

var knoepfe = document.querySelectorAll(".tabs button");
for(var i = 0; i < knoepfe.length; i++){
  knoepfe[i].addEventListener("click", function(){
    reiterSetzen(this.getAttribute("data-art"));
  });
}
el("suche").addEventListener("input", suchen);

/* Der Bildungsgang gilt für die ganze Seite t-bk.de - hier wird er gewählt,
   in den Lektionen wirkt er weiter. */
if(window.tbkBildungsgang){
  var w = window.tbkBildungsgang.waehler(function(){ suchen(); });
  el("bg-zeile").appendChild(w.knoten);
  var bgHinweis = document.createElement("p");
  bgHinweis.className = "bg-hinweis";
  bgHinweis.textContent = "Zeigt nur, was im Bildungsplan vorgesehen ist – "
    + "in den Lektionen wirkt die Wahl weiter und lässt sich dort ändern.";
  el("bg-zeile").appendChild(bgHinweis);
  window.tbkBildungsgang.beiFremderWahl(function(neu){
    w.feld.value = neu;
    suchen();
  });
}

reiterSetzen("simulation");
</script>
</body>
</html>
